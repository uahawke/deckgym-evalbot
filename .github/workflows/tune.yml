name: Tune value function

on:
  workflow_dispatch:
    inputs:
      generations:
        description: 'CMA-ES generations'
        default: '3'
      popsize:
        description: 'Population size'
        default: '4'
      games:
        description: 'Games per cell'
        default: '20'
      decks:
        description: 'Number of training decks'
        default: '3'
      opponent_params:
        description: 'Reference opponent params file'
        default: 'tuned_params_v5.json'
      init_params:
        description: 'Params to seed the search from (blank = start from BASELINE, the old behavior)'
        default: 'tuned_params_v5.json'
      seed_rotation:
        description: 'Rotate seeds every N generations (0 disables)'
        default: '5'
      tie_penalty:
        description: 'Fitness penalty per tie (turn-30 timeouts)'
        default: '0.25'
      seeds:
        description: 'Comma-separated base seeds; each runs as a parallel replicate'
        default: '1'

jobs:
  # One replicate per seed. Independent runs make it possible to tell a real gain
  # from seed luck: if only one replicate beats the reference, it was noise.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      seeds: ${{ steps.split.outputs.seeds }}
    steps:
      - id: split
        run: |
          JSON=$(echo '${{ inputs.seeds }}' | tr -d ' ' | jq -R 'split(",")' -c)
          echo "seeds=$JSON" >> "$GITHUB_OUTPUT"

  tune:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(needs.prepare.outputs.seeds) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install cma numpy

      - name: Build eval_bot
        run: cargo build --release --bin eval_bot

      - name: Run tuner
        run: |
          INIT_FLAG=""
          if [ -n "${{ inputs.init_params }}" ]; then
            INIT_FLAG="--init-params ${{ inputs.init_params }}"
          fi
          python -u python/tune_value_function.py \
            --generations ${{ inputs.generations }} \
            --popsize ${{ inputs.popsize }} \
            --games ${{ inputs.games }} \
            --decks ${{ inputs.decks }} \
            --decks-folder decks/train \
            --opponents e1 \
            --opponent-params ${{ inputs.opponent_params }} \
            --seed ${{ matrix.seed }} \
            --seed-rotation ${{ inputs.seed_rotation }} \
            --tie-penalty ${{ inputs.tie_penalty }} \
            $INIT_FLAG \
            --out tuned_params_ci.json 2>&1 | tee tune.log

      - name: Validate on held-out decks
        run: |
          cargo run --release --bin eval_bot -- \
            --candidate e1 --params tuned_params_ci.json \
            --opponents e1 --opponent-params ${{ inputs.opponent_params }} \
            --games 150 --max-decks 10 --seed 999999 \
            --json validation.json | tee validation.txt

      - uses: actions/upload-artifact@v4
        with:
          name: tuning-results-seed${{ matrix.seed }}
          path: |
            tuned_params_ci.json
            tune.log
            validation.json
            validation.txt
